<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 设计台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <span class="title">API 设计台</span>
    <span id="specBadge" class="badge">IDL v0.1</span>
    <button id="themeToggle" class="btn theme-btn" title="切换 浅色 / 暗夜 模式">浅色</button>
  </div>
  <div class="meta">
    <button id="addResourceBtn" class="btn" title="新增一个资源">＋ 资源</button>
    <button id="addModelBtn" class="btn" title="新增一个模型">＋ 模型</button>
    <button id="saveBtn" class="btn primary" title="保存 IDL 项目到本地 project.json">保存</button>
    <button id="loadBtn" class="btn" title="从本地 project.json 载入">载入</button>
    <span id="saveStatus" class="buf-status"></span>
  </div>
</header>

<main id="layout">
  <!-- 左侧：资源/模型树 -->
  <aside id="sidebar">
    <div class="side-head">
      <input id="filter" type="text" placeholder="筛选…">
      <span id="countLabel"></span>
    </div>
    <div id="tree"></div>
  </aside>

  <!-- 中间：表单编辑区 -->
  <section id="content">
    <div id="formArea" class="card">
      <div id="formHead"></div>
      <div id="formBody"></div>
    </div>
  </section>

  <!-- 右侧：预览/源码/调试台（可拖宽） -->
  <div id="bufResizer" title="拖动调整宽度"></div>
  <aside id="rightpan">
    <div class="tabs">
      <button class="tab-btn active" data-tab="source">IDL 源码</button>
      <button class="tab-btn" data-tab="openapi">OpenAPI</button>
      <button class="tab-btn" data-tab="proto">proto</button>
      <button class="tab-btn" data-tab="debug">调试台</button>
    </div>
    <div class="tab-panel" id="panel-source">
      <div class="panel-toolbar">
        <span class="hist-hint">YAML 源码（编辑后回车/失焦即回填表单）</span>
        <span id="sourceStatus" class="buf-status"></span>
      </div>
      <textarea id="sourceInput" spellcheck="false"></textarea>
    </div>
    <div class="tab-panel" id="panel-openapi" hidden>
      <div class="panel-toolbar">
        <span class="hist-hint">OpenAPI 3.1（实时生成）</span>
        <button id="copyOpenapi" class="btn">复制</button>
      </div>
      <pre id="openapiView"></pre>
    </div>
    <div class="tab-panel" id="panel-proto" hidden>
      <div class="panel-toolbar">
        <span class="hist-hint">protobuf / gRPC（实时生成）</span>
        <button id="copyProto" class="btn">复制</button>
      </div>
      <pre id="protoView"></pre>
    </div>
    <div class="tab-panel" id="panel-debug" hidden>
      <div id="debugForm"></div>
    </div>
  </aside>
</main>

<script src="/vendor/js-yaml.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
